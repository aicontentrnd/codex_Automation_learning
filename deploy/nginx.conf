# Include in nginx's http context. Supply actual TLS certificates and hostname.
limit_req_zone $binary_remote_addr zone=image_requests:10m rate=5r/s;
server {
    listen 443 ssl;
    server_name images.example.com;
    ssl_certificate /etc/ssl/images/fullchain.pem;
    ssl_certificate_key /etc/ssl/images/privkey.pem;
    client_max_body_size 12m;
    client_body_timeout 15s;
    location / {
        limit_req zone=image_requests burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
