<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image requests</title>
<link rel="stylesheet" href="/style.css">
<h1>Image requests</h1>
<p>Enter your application token and prompt. The token stays in this browser tab.</p>
<form id="form">
  <label>Application token <input id="token" type="password" required autocomplete="off"></label>
  <label>Image prompt <textarea id="prompt" required maxlength="16000"></textarea></label>
  <label>Aspect ratio <input id="ratio" placeholder="4:5" pattern="[1-9][0-9]{0,2}:[1-9][0-9]{0,2}"></label>
  <label>Project ID (optional) <input id="project" maxlength="128"></label>
  <label>Queue ID (optional) <input id="queue" maxlength="128"></label>
  <button>Create image request</button>
</form>
<p id="status" role="status"></p>
<button id="retry" type="button" hidden>Retry request</button>
<img id="result" alt="Generated image" hidden>
<script src="/app.js" defer></script>
</html>
